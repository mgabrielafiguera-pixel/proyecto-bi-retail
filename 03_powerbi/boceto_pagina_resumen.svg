<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1280" height="720" fill="#F4F5F7"/>

  <!-- Título -->
  <text x="40" y="58" font-size="26" font-weight="600" fill="#1F2937">Sell In / Sell Out — Resumen</text>
  <text x="40" y="84" font-size="13" fill="#6B7280">Retail BI v2 · importes escalados, datos anonimizados</text>

  <!-- Filtros -->
  <g font-size="12" fill="#374151">
    <text x="40" y="118" font-weight="600">Año</text>
    <g>
      <rect x="40" y="126" width="64" height="30" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
      <text x="57" y="146">2023</text>
      <rect x="110" y="126" width="64" height="30" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
      <text x="127" y="146">2024</text>
      <rect x="180" y="126" width="64" height="30" rx="4" fill="#2563EB"/>
      <text x="197" y="146" fill="#FFFFFF" font-weight="600">2025</text>
      <rect x="250" y="126" width="64" height="30" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
      <text x="267" y="146">2026</text>
    </g>
    <text x="360" y="118" font-weight="600">Departamento</text>
    <rect x="360" y="126" width="240" height="30" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="372" y="146" fill="#6B7280">Todos</text>
    <text x="584" y="146" fill="#6B7280">▾</text>
    <text x="630" y="118" font-weight="600">Marca</text>
    <rect x="630" y="126" width="240" height="30" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="642" y="146" fill="#6B7280">Todas</text>
    <text x="854" y="146" fill="#6B7280">▾</text>
  </g>

  <!-- Tarjetas KPI -->
  <g font-size="12">
    <g transform="translate(40,182)">
      <rect width="190" height="104" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="16" y="28" fill="#6B7280">Importe Sell Out</text>
      <text x="16" y="66" font-size="26" font-weight="600" fill="#111827">00.000.000</text>
      <text x="16" y="90" fill="#9CA3AF">[Importe Sell Out]</text>
    </g>
    <g transform="translate(244,182)">
      <rect width="190" height="104" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="16" y="28" fill="#6B7280">Var. vs año anterior</text>
      <text x="16" y="66" font-size="26" font-weight="600" fill="#047857">+0,0 %</text>
      <text x="16" y="90" fill="#9CA3AF">[Importe Sell Out Var %]</text>
    </g>
    <g transform="translate(448,182)">
      <rect width="190" height="104" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="16" y="28" fill="#6B7280">Margen %</text>
      <text x="16" y="66" font-size="26" font-weight="600" fill="#111827">00,0 %</text>
      <text x="16" y="90" fill="#9CA3AF">[Margen %]</text>
    </g>
    <g transform="translate(652,182)">
      <rect width="190" height="104" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="16" y="28" fill="#6B7280">Sell-Through %</text>
      <text x="16" y="66" font-size="26" font-weight="600" fill="#111827">00,0 %</text>
      <text x="16" y="90" fill="#9CA3AF">[Sell-Through %]</text>
    </g>
    <g transform="translate(856,182)">
      <rect width="190" height="104" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="16" y="28" fill="#6B7280">Ticket promedio</text>
      <text x="16" y="66" font-size="26" font-weight="600" fill="#111827">0.000,00</text>
      <text x="16" y="90" fill="#9CA3AF">[Ticket Promedio]</text>
    </g>
    <g transform="translate(1050,182)">
      <rect width="190" height="104" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="16" y="28" fill="#6B7280">Devoluciones %</text>
      <text x="16" y="66" font-size="26" font-weight="600" fill="#111827">0,0 %</text>
      <text x="16" y="90" fill="#9CA3AF">[Devoluciones %]</text>
    </g>
  </g>

  <!-- Gráfico de línea -->
  <g transform="translate(40,306)">
    <rect width="1200" height="374" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="20" y="32" font-size="15" font-weight="600" fill="#1F2937">Importe Sell Out por mes: año seleccionado vs año anterior</text>
    <g font-size="12">
      <line x1="820" y1="27" x2="844" y2="27" stroke="#2563EB" stroke-width="3"/>
      <text x="850" y="31" fill="#374151">Importe Sell Out</text>
      <line x1="980" y1="27" x2="1004" y2="27" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="6 4"/>
      <text x="1010" y="31" fill="#374151">Importe Sell Out AA</text>
    </g>
    <!-- ejes -->
    <g stroke="#EEF0F3">
      <line x1="70" y1="90" x2="1170" y2="90"/>
      <line x1="70" y1="160" x2="1170" y2="160"/>
      <line x1="70" y1="230" x2="1170" y2="230"/>
      <line x1="70" y1="300" x2="1170" y2="300"/>
    </g>
    <line x1="70" y1="320" x2="1170" y2="320" stroke="#D1D5DB"/>
    <!-- serie AA -->
    <polyline fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-dasharray="6 4"
      points="110,250 200,262 290,240 380,236 470,226 560,232 650,222 740,216 830,206 920,198 1010,180 1100,130"/>
    <!-- serie actual -->
    <polyline fill="none" stroke="#2563EB" stroke-width="3"
      points="110,236 200,244 290,222 380,214 470,208 560,200 650,204 740,190 830,178 920,170 1010,150 1100,104"/>
    <g font-size="12" fill="#6B7280" text-anchor="middle">
      <text x="110" y="342">ene</text><text x="200" y="342">feb</text><text x="290" y="342">mar</text>
      <text x="380" y="342">abr</text><text x="470" y="342">may</text><text x="560" y="342">jun</text>
      <text x="650" y="342">jul</text><text x="740" y="342">ago</text><text x="830" y="342">sep</text>
      <text x="920" y="342">oct</text><text x="1010" y="342">nov</text><text x="1100" y="342">dic</text>
    </g>
    <text x="20" y="362" font-size="11" fill="#9CA3AF">Eje X: Calendario[Nombre_Mes] · Valores: [Importe Sell Out], [Importe Sell Out AA] · Boceto: la forma de las líneas es ilustrativa</text>
  </g>
</svg>
